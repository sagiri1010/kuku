<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くくクエスト</title>

<!-- 見た目を丸くて可愛いフォントにするため、Googleフォントを読み込んでいます -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  /* =====================================================
     ▼ 見た目(デザイン)の設定はすべてここに書いています。
       色や文字サイズを変えたい場合はここを触ればOKです。
     ===================================================== */
  :root{
    --color-bg-top:#9AD8FF;      /* 空の色(上) */
    --color-bg-bottom:#BFE8A6;   /* 地面の色(下) */
    --color-card:#FFFBF0;        /* カード(白いパネル)の色 */
    --color-accent:#FF9640;      /* オレンジ(ボタンなど) */
    --color-accent-dark:#E67A20;
    --color-text:#2B2140;        /* 基本の文字色 */
    --color-good:#4CAF50;        /* 正解の色 */
    --color-bad:#E85555;         /* 不正解の色 */
    font-family: "M PLUS Rounded 1c", sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(180deg, var(--color-bg-top) 0%, var(--color-bg-top) 40%, var(--color-bg-bottom) 100%);
    color:var(--color-text);
    display:flex;
    justify-content:center;
    padding:16px;
  }

  #app{
    width:100%;
    max-width:520px;
  }

  /* ---------- ヘッダー ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    row-gap:6px;
    margin-bottom:8px;
  }
  .header h1{
    font-size:22px;
    font-weight:800;
    margin:0;
    color:#fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .header-buttons button{
    background:rgba(255,255,255,0.85);
    border:none;
    border-radius:10px;
    padding:6px 10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--color-text);
  }
  .header-buttons button.active{
    background:var(--color-accent);
    color:#fff;
  }

  /* ---------- スコアバー ---------- */
  .status-bar{
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    border-radius:14px;
    padding:8px 14px;
    margin-bottom:8px;
    font-weight:700;
    font-size:14px;
  }

  /* ---------- 進捗バー(旧マップの代わり) ---------- */
  .progress-wrap{
    background: var(--color-card);
    border-radius:16px;
    padding:12px 14px 10px;
    margin-bottom:10px;
    box-shadow:0 4px 0 rgba(0,0,0,0.08);
  }
  .progress-track{
    position:relative;
    height:14px;
    background:#EFEAD8;
    border-radius:8px;
    margin:14px 4px 4px; /* 上に目印アイコンがはみ出るための余白 */
  }
  .progress-fill{
    height:100%;
    background:var(--color-accent);
    border-radius:8px;
    transition:width 0.4s ease;
  }
  .progress-marker{
    position:absolute;
    top:50%;
    transform:translate(-50%, -50%);
    font-size:16px;
    line-height:1;
  }
  .progress-marker.passed{ opacity:0.35; }
  .progress-endpoint{
    position:absolute;
    top:50%;
    transform:translate(-50%, -50%);
    font-size:14px;
  }
  .progress-hero{
    position:absolute;
    top:50%;
    transform:translate(-50%, -85%);
    font-size:20px;
    transition:left 0.4s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:700;
    color:#7A7266;
    margin-top:6px;
  }

  /* ---------- バトル画面 ---------- */
  .battle-wrap{
    position:relative; /* 一時停止オーバーレイの基準位置にするため */
    background: var(--color-card);
    border-radius:20px;
    padding:18px;
    text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,0.08);
    min-height:320px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .monster-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .monster-area img{
    width:120px;
    height:120px;
    object-fit:contain;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.15));
  }
  .monster-area img.boss-img{ width:150px; height:150px; }
  .monster-label{
    font-size:13px;
    font-weight:700;
    background:rgba(0,0,0,0.06);
    padding:2px 10px;
    border-radius:10px;
  }

  .intro-text{
    font-size:20px;
    font-weight:800;
    margin-top:20px;
  }

  .question-box{
    font-size:34px;
    font-weight:800;
    margin:10px 0;
  }

  .timer-outer{
    width:100%;
    height:10px;
    background:#E5E0D0;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .timer-inner{
    height:100%;
    background:var(--color-accent);
  }

  .answers{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .answer-btn{
    font-size:24px;
    font-weight:800;
    padding:16px 0;
    border-radius:14px;
    border:none;
    background:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    cursor:pointer;
    color:var(--color-text);
  }
  .answer-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }
  .answer-btn.correct{ background:var(--color-good); color:#fff; }
  .answer-btn.wrong{ background:var(--color-bad); color:#fff; }

  .result-text{
    font-size:22px;
    font-weight:800;
    margin:10px 0;
  }
  .result-text.good{ color:var(--color-good); }
  .result-text.bad{ color:var(--color-bad); }

  .start-btn{
    background:var(--color-accent);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:12px 20px;
    font-size:16px;
    font-weight:800;
    box-shadow:0 4px 0 var(--color-accent-dark);
    cursor:pointer;
  }
  .start-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--color-accent-dark); }

  /* ---------- ボーナスのくじ引きカード ---------- */
  .bonus-cards{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:16px 0;
  }
  .bonus-card{
    width:72px;
    height:92px;
    font-size:30px;
    border-radius:12px;
    border:none;
    background: linear-gradient(160deg, #FFD76A, #F6B93B);
    box-shadow:0 4px 0 #C98A1E;
    cursor:pointer;
    color:#fff;
  }
  .bonus-card:active{ transform:translateY(2px); box-shadow:0 2px 0 #C98A1E; }
  .bonus-card:disabled{ opacity:0.45; cursor:default; }
  .bonus-card.picked{
    background: linear-gradient(160deg, #FFF3C4, #FFD76A);
    opacity:1;
    box-shadow:0 4px 0 #C98A1E, 0 0 12px 4px rgba(255,215,106,0.9);
  }

  /* ---------- 一時停止オーバーレイ ---------- */
  .pause-overlay{
    position:absolute;
    inset:0;
    background:rgba(20,15,35,0.6);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    border-radius:20px;
    z-index:10;
  }
  .hidden{ display:none; }

  /* ---------- ゴール画面 ---------- */
  .goal-wrap{
    text-align:center;
    padding:30px 10px;
  }
  .goal-wrap h2{ font-size:26px; }

</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>くくクエスト</h1>
    <div class="header-buttons">
      <button id="pauseBtn">⏸ 一時停止</button>
      <button id="muteBtn">🔊 音</button>
      <button id="resetBtn">さいしょから</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="scoreText">スコア: 0</span>
    <span id="comboText">れんぞく正解: 0</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-track" id="progressTrack"></div>
    <div class="progress-label">
      <span id="progressText">0 / 25 マス</span>
      <span>👑ボス　🎁ボーナス</span>
    </div>
  </div>

  <div class="battle-wrap" id="battleWrap">
    <div class="pause-overlay hidden" id="pauseOverlay">⏸ 一時停止中</div>
  </div>
</div>

<script>
/* =====================================================================
   ▼▼▼ 仕様説明(このゲームの全体像) ▼▼▼

   【ゲーム内容】
   すごろく形式で九九を練習するゲームです。全25マス。
   ・通常マス:九九の4択問題。正解で1マス進み、不正解/時間切れで1マス後退。
   ・ボスマス(7マスごと):6〜9の段の問題。
       「CONFIG.BOSS_HITS_NEEDED」回(初期値2回)連続で正解しないと倒せない。
       1回正解しても倒せなければ、そのマスのまま新しい問題がもう一度出る。
       不正解になると、連続正解カウントは0に戻り、1マス後退する。
   ・ボスマス(7マスごと):6〜9の段の問題。登場演出のあと、画像と
       タイマーバーを1回だけ表示し、その1本のタイマー(合計時間。
       CONFIG.BOSS_TOTAL_TIME_MIN〜MAX)が減り続けている間に問題を
       「CONFIG.BOSS_HITS_NEEDED」回(初期値2回)連続で正解すると倒せる。
       1問目にどれだけ時間を使っても、2問目はその残り時間で答える形になる
       (例:合計10秒のうち1問目に8秒使ったら、2問目は残り2秒)。
       画像・タイマーバーは2問の間ずっと同じもの(リセットしない)。
       不正解、または合計時間切れになると、連続正解カウントは0に戻り、
       1マス後退する。
   ・ボーナスマス(ランダム4か所):九九の問題は出ず、伏せられたカードが
       3枚並ぶ「くじ引き」になる。1枚選んで開けると、進むマス数や
       スコアなどの報酬がもらえる(ハズレなし)。

   【進行方法(自動進行+一時停止)】
   ボタンを押さなくても自動で進みます。
     モンスターが現れる → (少し待つ) → 問題(制限時間あり) → 答える
     → 結果表示 → (少し待つ) → 次のマスへ …
   (ボーナスマスだけは「カードを選ぶ」ところだけ手動タップが必要です)
   待ち時間はランダムにしていて、毎回テンポが変わります。
   右上の「⏸ 一時停止」でいつでも止められ、再開できます。

   【効果音の役割】
   ・「ボタンを選んだ瞬間」の短い音(playCorrectSound) … ボス戦で1発
     当てたが、まだ倒せていない(マスがまだ進まない)ときなど。
   ・「実際にマスが進む(お祝い)」ときだけ鳴る、上がっていく3音の
     明るい音(playAdvanceSound) … 通常マスに正解したとき、ボスを
     倒してマスが進んだ瞬間など。
   ・ボーナスのカードを開けた音(playBonusSound)、不正解の音
     (playWrongSound)、ゴールの音(playGoalSound)は、それぞれ専用。

   【重要な修正履歴】
   ・登場演出と問題画面のモンスター画像が一致するよう、出題内容を
     マスに到着した瞬間に1回だけ決めるようにした。
   ・自動進行タイマーの消し忘れによる誤判定/一時停止が効かない不具合を
     修正(新しいタイマーを予約する前に必ず前のタイマーを止める)。
   ・ボーナスマスをくじ引き形式に変更、ボスマスを「1本のタイマーで2問
     連続正解」方式に変更。効果音の役割を「選んだ音」と「進む音」に分けた。

   【保存について】
   今のマス位置・マップ内容・スコアを保存し、次回開いたときも続きから
   遊べるようにしている。「さいしょから」で保存データを消してやり直せる。
   保存先は環境によって自動で切り替わる:
   ・Claudeの中で開いたとき → window.storage を使う
   ・GitHub Pagesなど、外部で普通のWebページとして開いたとき
     → ブラウザ標準の localStorage を使う(isClaudeStorageAvailable関数で判定)
   ※ボス戦の連続正解カウント(bossHitsSoFar)は保存していないため、
     ボス戦の途中でページを閉じると、次に開いたときは1問目からに
     なります(仕様上の割り切りです)。

   【画像について】
   GitHub上の画像(SVG)を IMAGE_BASE + ファイル名 で読み込んでいます。
   表示されない場合はリポジトリが公開設定か、ブランチ名が "main" かを
   確認してください(読み込み失敗時は絵文字で代わりに表示します)。

   【ファイル構成】
   1. CONFIG            … 設定値(ここを変えれば挙動が変わる)
   2. state               … ゲームの状態
   3. storage関連関数      … 保存・読み込み
   4. マップ生成関数
   5. 問題生成関数 / くじ引き抽選関数
   6. 自動進行タイマー(scheduleAuto等)
   7. 効果音
   8. 描画(render)関数
   9. イベント処理(ゲームの流れ)
   10. 初期化
   ===================================================================== */


  /* ---------------------------------------------------------------
     1. CONFIG : 調整したい数値・対応表はすべてここにまとめています
     --------------------------------------------------------------- */
  const CONFIG = {
    IMAGE_BASE: "https://raw.githubusercontent.com/sagiri1010/kuku/main/",

    MAP_LENGTH: 25,
    BOSS_INTERVAL: 7,
    BONUS_COUNT: 4,

    // 制限時間(ミリ秒)。ランダムに幅を持たせてテンポを変える(通常マス用)
    TIME_NORMAL_MIN: 5000,
    TIME_NORMAL_MAX: 8000,

    // ボス戦は「2問まとめて1本のタイマー」で管理する。
    // 例:合計10秒のうち1問目に8秒使ったら、2問目は残り2秒で答える。
    BOSS_TOTAL_TIME_MIN: 9000,
    BOSS_TOTAL_TIME_MAX: 12000,

    // ボスの「登場演出」は文字が長い(倒し方の説明が入る)ので、
    // 通常マスより長めに表示する専用の待ち時間
    BOSS_INTRO_DELAY_MIN: 2200,
    BOSS_INTRO_DELAY_MAX: 3000,

    // 自動進行の「待ち時間」もランダムにしてテンポを変える(通常マス用)
    INTRO_DELAY_MIN: 700,
    INTRO_DELAY_MAX: 1400,
    RESULT_DELAY_MIN: 1200,
    RESULT_DELAY_MAX: 1900,

    // ボスを倒すのに何回連続正解が必要か
    BOSS_HITS_NEEDED: 2,

    // ボーナスのくじ引きで並べるカードの枚数
    BONUS_CARD_COUNT: 3,

    // ボーナスの報酬候補。weightが大きいほど当たりやすい(ハズレはナシ)
    BONUS_REWARDS: [
      { label: "1マスすすむ",              steps: 1, score: 10, weight: 30 },
      { label: "2マスすすむ",              steps: 2, score: 20, weight: 30 },
      { label: "3マスすすむ！",            steps: 3, score: 30, weight: 20 },
      { label: "スコア+30！",              steps: 1, score: 30, weight: 15 },
      { label: "ラッキー！4マスすすむ！！", steps: 4, score: 40, weight: 5  },
    ],

    // 段(1〜9)ごとに、どのモンスター画像を出すか
    tableToImage: {
      1: "character_teki.svg",
      2: "character_monster_slime_green.svg",
      3: "character_monster_kinoko_red.svg",
      4: "character_monster_ghost_white.svg",
      5: "character_monster_treant_02_green.svg",
      6: "character_monster_majo_02_orange.svg",
      7: "character_monster_frankenstein_02_blue.svg",
      8: "character_monster_yeti_01_blue.svg",
      9: "character_monster_dragon_01_yellow.svg",
    },
    tableToName: {
      1: "ざこてき", 2: "スライム", 3: "キノコ", 4: "ゴースト",
      5: "トレント", 6: "まじょ", 7: "フランケン", 8: "イエティ", 9: "ドラゴン",
    },

    // ボスは複数体用意し、1体目・2体目・3体目…の順に割り当てる
    // (ボスがこの配列より多く出てくる場合は、また先頭から繰り返す)
    BOSS_IMAGES: [
      "character_monster_mimic_purple.svg",
      "character_monster_dragon_01_yellow.svg",
      "character_monster_yeti_01_blue.svg",
    ],
    BOSS_NAMES: [
      "ミミック(ボス)",
      "ドラゴン(ボス)",
      "イエティ(ボス)",
    ],
    BONUS_IMAGE: "character_monster_hi_blue.svg",
    HERO_IMAGE: "character_heishi_armor_02_01_blue.svg",

    STORAGE_KEY: "kuku_quest_state",
    SAVE_VERSION: 1,
  };


  /* ---------------------------------------------------------------
     2. state : 今このゲームがどんな状態かを持っておく変数
     --------------------------------------------------------------- */
  let state = {
    version: CONFIG.SAVE_VERSION,
    cellTypes: [],
    currentStage: 0,
    score: 0,
    combo: 0,
    bestCombo: 0,
    muted: false,
  };

  let currentQuestion = null;
  let answered = false;
  let isPaused = false;
  let questionTimerActive = false;

  // ボス戦だけで使う、一時的な変数(保存はしない)
  // 今のボスに何回連続で正解しているか
  let bossHitsSoFar = 0;
  // 今戦っているボスの見た目(画像・名前)。マスに到着したときに1回だけ決める
  let currentBossVariant = { image: CONFIG.BOSS_IMAGES[0], name: CONFIG.BOSS_NAMES[0] };


  /* ---------------------------------------------------------------
     3. storage関連関数 : 保存・読み込み
        -----------------------------------------------------------
        このゲームは2つの場所で動くことを想定している。
        ・Claudeの中でこのファイルを開いたとき → window.storage が使える
        ・GitHub Pagesなど、外部で普通のWebページとして開いたとき
          → window.storage は存在しないので、ブラウザ標準の
            localStorage を代わりに使う。
        isClaudeStorageAvailable() でどちらの環境か判定し、
        以降の関数はその結果に応じて処理を振り分けている。
     --------------------------------------------------------------- */
  function isClaudeStorageAvailable(){
    return typeof window.storage !== "undefined"
        && typeof window.storage.get === "function";
  }

  async function loadState(){
    try{
      if (isClaudeStorageAvailable()){
        const res = await window.storage.get(CONFIG.STORAGE_KEY);
        if (res && res.value){
          const data = JSON.parse(res.value);
          if (data.version === CONFIG.SAVE_VERSION) return data;
        }
      } else {
        const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (raw){
          const data = JSON.parse(raw);
          if (data.version === CONFIG.SAVE_VERSION) return data;
        }
      }
    }catch(e){
      // 保存データがまだ無い場合はここに来ます(初回プレイ)。エラーではありません。
    }
    return null;
  }

  async function saveState(){
    try{
      if (isClaudeStorageAvailable()){
        await window.storage.set(CONFIG.STORAGE_KEY, JSON.stringify(state));
      } else {
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
      }
    }catch(e){
      console.error("保存に失敗しました:", e);
    }
  }

  async function clearState(){
    try{
      if (isClaudeStorageAvailable()){
        await window.storage.delete(CONFIG.STORAGE_KEY);
      } else {
        localStorage.removeItem(CONFIG.STORAGE_KEY);
      }
    }catch(e){ /* もともと無い場合は無視してよい */ }
  }


  /* ---------------------------------------------------------------
     4. マップ生成関数 : ボス・ボーナスマスの配置を決める
     --------------------------------------------------------------- */
  function generateMap(){
    const types = new Array(CONFIG.MAP_LENGTH).fill("normal");

    for (let i = CONFIG.BOSS_INTERVAL - 1; i < CONFIG.MAP_LENGTH; i += CONFIG.BOSS_INTERVAL){
      types[i] = "boss";
    }

    let placed = 0;
    let safetyCounter = 0;
    while (placed < CONFIG.BONUS_COUNT && safetyCounter < 500){
      safetyCounter++;
      const idx = Math.floor(Math.random() * (CONFIG.MAP_LENGTH - 1));
      if (types[idx] === "normal"){
        types[idx] = "bonus";
        placed++;
      }
    }
    return types;
  }


  /* ---------------------------------------------------------------
     5. 問題生成関数 / くじ引き抽選関数
     --------------------------------------------------------------- */
  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makeQuestion(cellType){
    const isBoss = cellType === "boss";
    const a = isBoss ? randInt(6, 9) : randInt(1, 9);
    const b = randInt(1, 9);
    const answer = a * b;

    const candidates = new Set();
    const tryAdd = (v) => { if (v > 0 && v !== answer) candidates.add(v); };
    tryAdd((a + 1) * b);
    tryAdd((a - 1) * b);
    tryAdd(a * (b + 1));
    tryAdd(a * (b - 1));
    tryAdd(answer + a);
    tryAdd(answer - a);
    tryAdd(answer + b);
    tryAdd(answer - b);

    const candidateList = Array.from(candidates);
    for (let i = candidateList.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [candidateList[i], candidateList[j]] = [candidateList[j], candidateList[i]];
    }
    let wrongOptions = candidateList.slice(0, 3);
    while (wrongOptions.length < 3){
      const v = answer + randInt(-10, 10);
      if (v > 0 && v !== answer && !wrongOptions.includes(v)){
        wrongOptions.push(v);
      }
    }

    const options = [...wrongOptions, answer];
    for (let i = options.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }

    return { a, b, answer, options, tableForImage: a, isBoss };
  }

  // 今のマス(stageIndex)が「何体目のボス」かを数えて、対応する見た目を選ぶ。
  // 例: 1体目のボスマスなら CONFIG.BOSS_IMAGES[0]、2体目なら[1]…という具合。
  // 配列より多くのボスが出てくる場合は、また先頭から繰り返す(あまりの計算)。
  function pickBossVariant(stageIndex){
    let bossOrdinal = 0; // 何体目か(1から数える)
    for (let i = 0; i <= stageIndex; i++){
      if (state.cellTypes[i] === "boss") bossOrdinal++;
    }
    const idx = (bossOrdinal - 1) % CONFIG.BOSS_IMAGES.length;
    return { image: CONFIG.BOSS_IMAGES[idx], name: CONFIG.BOSS_NAMES[idx] };
  }

  // 重み付き抽選で、ボーナスの報酬を1つ選ぶ(ハズレなし)
  function pickWeightedReward(){
    const pool = CONFIG.BONUS_REWARDS;
    const totalWeight = pool.reduce((sum, r) => sum + r.weight, 0);
    let r = Math.random() * totalWeight;
    for (const reward of pool){
      if (r < reward.weight) return reward;
      r -= reward.weight;
    }
    return pool[pool.length - 1]; // 浮動小数点の誤差対策の保険
  }


  /* ---------------------------------------------------------------
     6. 自動進行タイマー(一時停止の仕組みの土台)
        ★重要: scheduleAuto は、前の予約が残っていたら必ず先に止めてから
        新しく予約する。これを忘れると、前の予約が裏で生き残ったまま
        動き続け、後から関係ないタイミングで勝手に発動する
        (実際にこの不具合が起きたため、必ず止めるようにしている)。
     --------------------------------------------------------------- */
  const autoTimer = {
    timeoutId: null,
    callback: null,
    remainingMs: 0,
    startedAt: 0,
    running: false,
  };

  function scheduleAuto(callback, delayMs){
    if (autoTimer.timeoutId !== null){
      clearTimeout(autoTimer.timeoutId);
      autoTimer.timeoutId = null;
      autoTimer.running = false;
    }
    autoTimer.callback = callback;
    autoTimer.remainingMs = delayMs;
    startAutoCountdown();
  }

  function startAutoCountdown(){
    autoTimer.startedAt = Date.now();
    autoTimer.running = true;
    autoTimer.timeoutId = setTimeout(() => {
      autoTimer.running = false;
      autoTimer.timeoutId = null;
      const cb = autoTimer.callback;
      autoTimer.callback = null;
      if (cb) cb();
    }, autoTimer.remainingMs);
  }

  function pauseAutoTimer(){
    if (!autoTimer.running) return;
    clearTimeout(autoTimer.timeoutId);
    autoTimer.timeoutId = null;
    const elapsed = Date.now() - autoTimer.startedAt;
    autoTimer.remainingMs = Math.max(0, autoTimer.remainingMs - elapsed);
    autoTimer.running = false;
  }

  function resumeAutoTimer(){
    if (autoTimer.callback === null) return;
    startAutoCountdown();
  }


  /* ---------------------------------------------------------------
     7. 効果音(簡易) : 外部ファイル無しでビープ音を鳴らす
     --------------------------------------------------------------- */
  let audioCtx = null;
  function playTone(freq, duration){
    if (state.muted) return;
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "square";
      gain.gain.value = 0.06;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration / 1000);
    }catch(e){ /* 音が出せない環境は無視 */ }
  }
  function playCorrectSound(){ playTone(880, 150); }        // ボタンを選んだ瞬間の「ピッ」
  function playWrongSound(){ playTone(220, 250); }
  function playGoalSound(){ playTone(660, 400); }
  function playBonusSound(){ playTone(1046, 180); }          // ボーナスのカードを開けた音

  // 実際にマスが進む(お祝いの)瞬間だけ鳴らす、上がっていく3音の明るい音
  function playAdvanceSound(){
    if (state.muted) return;
    playTone(523, 120);                       // ド
    setTimeout(() => playTone(659, 120), 100); // ミ
    setTimeout(() => playTone(784, 220), 200); // ソ
  }

  /* --- ここからボス戦専用の描画関数 ---
     ボス戦は「画像とタイマーバーを1回だけ表示し、その1本のバーが
     減り続けている間に問題を2問続けて出す」という特殊な流れなので、
     通常マスの renderQuestion とは別に用意している。
     renderBossBattleScreen : 1問目のときに1回だけ呼ぶ(画像・バーを作る)
     updateBossQuestionOnly : 2問目に切り替えるときに呼ぶ(文章と選択肢だけ差し替え。
                               画像とタイマーバーには一切触らない) */

  // ボス戦の画面をまるごと作る(1問目の最初、1回だけ呼ばれる)
  function renderBossBattleScreen(totalMs){

      </div>

    `;

    withFallback(img, "👹");

  // 「のこり◯回」表示・問題文・選択肢だけを更新する(画像とタイマーバーは触らない)
  function updateBossQuestionText(){
    const q = currentQuestion;
    document.getElementById("bossLabel").textContent =
      `${currentBossVariant.name}（のこり${CONFIG.BOSS_HITS_NEEDED - bossHitsSoFar}回）`;
    document.getElementById("questionBox").textContent = `${q.a} × ${q.b} = ?`;

    const answersArea = document.getElementById("answersArea");
    answersArea.innerHTML = "";
    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = opt;
      btn.addEventListener("click", () => handleBossAnswer(opt, btn));
      answersArea.appendChild(btn);
    });
    answered = false;
  }

  // バトル画面: ボーナスの「くじ引き」を表示する
  function renderBonusChoice(){
    const wrap = document.getElementById("battleWrap");

    // カードごとに、あらかじめ中身(報酬)を決めておく(開けるまで見せない)
    const cardRewards = [];
    for (let i = 0; i < CONFIG.BONUS_CARD_COUNT; i++){
      cardRewards.push(pickWeightedReward());
    }

    wrap.innerHTML = `
      <div class="monster-area">
        <img id="bonusImg" src="${imgUrl(CONFIG.BONUS_IMAGE)}">

      </div>
      <div class="bonus-cards" id="bonusCards"></div>

      cardsArea.appendChild(card);
    });

    answered = false; // 二重タップ防止のフラグを流用

  // 結果表示(正解/不正解)。ボーナスのくじ引き結果はこの関数を使わず別に表示する。
  function renderResult(isCorrect, resultText){
    const wrap = document.getElementById("battleWrap");
    const text = resultText || (isCorrect ? "せいかい!" : "ざんねん…1マスもどる");
    const cls = isCorrect ? "good" : "bad";

      <div class="goal-wrap">

      </div>
    `;
    document.getElementById("playAgainBtn").addEventListener("click", async () => {

    });

  function syncPauseOverlay(){
    const overlay = document.getElementById("pauseOverlay");

    overlay.classList.toggle("hidden", !isPaused);
  }


  /* ---------------------------------------------------------------
     9. イベント処理(ゲームの流れそのもの)
     --------------------------------------------------------------- */

  // 新しいマスに到着したときの入り口
  function startNextTurn(){
    if (state.currentStage >= CONFIG.MAP_LENGTH){
      playGoalSound();
      renderGoal();
      renderProgress();
      renderStatusBar();
      saveState();
      return;
    }
    renderProgress();
    renderStatusBar();
    const cellType = state.cellTypes[state.currentStage];

    if (cellType === "bonus"){
      renderIntro(cellType, null);
      const delay = randInt(CONFIG.INTRO_DELAY_MIN, CONFIG.INTRO_DELAY_MAX);
      scheduleAuto(beginBonusPhase, delay);
      return;
    }

    if (cellType === "boss"){
      // ボスの登場演出は説明文が長いので、専用の長めの待ち時間を使う
      bossHitsSoFar = 0;
      currentBossVariant = pickBossVariant(state.currentStage); // 何体目のボスかで見た目を決める
      renderIntro(cellType, null);
      const delay = randInt(CONFIG.BOSS_INTRO_DELAY_MIN, CONFIG.BOSS_INTRO_DELAY_MAX);
      scheduleAuto(startBossBattle, delay);
      return;
    }

    currentQuestion = makeQuestion(cellType);
    renderIntro(cellType, currentQuestion);
    const delay = randInt(CONFIG.INTRO_DELAY_MIN, CONFIG.INTRO_DELAY_MAX);
    scheduleAuto(beginQuestionPhase, delay);
  }

  function beginQuestionPhase(){
    renderQuestion();
  }

  function beginBonusPhase(){
    renderBonusChoice();
  }

  /* --- ここからボス戦専用の進行処理 ---
     ボス戦は「画像とタイマーバーを1回だけ表示し、そのバーが減り続けている
     間に問題を2問続けて出す」という特殊な流れなので、通常マスの
     handleAnswer とは別の専用関数(handleBossAnswer)を用意している。 */

  // ボス戦の開始(登場演出のあとに呼ばれる。1問目を表示し、合計時間タイマーを1本だけ動かす)
  function startBossBattle(){
    currentQuestion = makeQuestion("boss");
    const totalMs = randInt(CONFIG.BOSS_TOTAL_TIME_MIN, CONFIG.BOSS_TOTAL_TIME_MAX);
    renderBossBattleScreen(totalMs);

    // 2問分まとめての「合計時間切れ」タイマー。1問目→2問目の切り替えでは
    // この予約を触らない(scheduleAutoを呼ばない)ことで、バーが止まらず
    // 減り続けるようにしている。
    scheduleAuto(handleBossTimeout, totalMs);
  }

  // 合計時間が切れたときの処理(まだ答えていなければ、不正解と同じ扱いにする)
  function handleBossTimeout(){
    if (answered) return; // すでに手動で回答済みなら何もしない(念のための保険)
    answered = true;
    questionTimerActive = false;
    playWrongSound();
    state.combo = 0;
    bossHitsSoFar = 0;
    state.currentStage = Math.max(0, state.currentStage - 1);
    finishBossEncounter(false);
  }

  // ボス戦の選択肢をタップしたときの処理
  function handleBossAnswer(selected, btnEl){
    if (answered) return;
    answered = true;

    const isCorrect = selected === currentQuestion.answer;

    const allBtns = document.querySelectorAll(".answer-btn");
    allBtns.forEach((b) => {
      b.disabled = true;
      if (Number(b.textContent) === currentQuestion.answer){
        b.classList.add("correct");
      } else if (b === btnEl){
        b.classList.add("wrong");
      }
    });

    if (isCorrect){
      playCorrectSound(); // 「あたった」という短い音(まだ進んだわけではないので進む音は鳴らさない)
      state.combo += 1;
      if (state.combo > state.bestCombo) state.bestCombo = state.combo;
      state.score += 10 + state.combo;
      bossHitsSoFar += 1;

      if (bossHitsSoFar < CONFIG.BOSS_HITS_NEEDED){
        // まだ倒せていない: 画像とタイマーバーはそのまま(触らない)で、
        // 少しだけ正解の色を見せてから2問目に切り替える。
        saveState();
        renderStatusBar();
        setTimeout(() => {
          currentQuestion = makeQuestion("boss");
          updateBossQuestionText(); // 文章と選択肢だけ差し替え。画像・バーはそのまま
          questionTimerActive = true;
        }, 500);
        return; // ここで終了。合計タイマーには触らない
      }

      // 必要な回数に達した: 撃破。ここでようやく「進む」ので、お祝いの音を鳴らす
      questionTimerActive = false;
      playAdvanceSound();
      bossHitsSoFar = 0;
      state.currentStage = Math.min(CONFIG.MAP_LENGTH, state.currentStage + 1);
      finishBossEncounter(true);
    } else {
      questionTimerActive = false;
      playWrongSound();
      state.combo = 0;
      bossHitsSoFar = 0;
      state.currentStage = Math.max(0, state.currentStage - 1);
      finishBossEncounter(false);
    }
  }

  // ボス戦の決着(勝ち/負け)処理をまとめる。
  // scheduleAutoを呼ぶことで、まだ残っていた合計時間タイマー(handleBossTimeout)は
  // 自動的に止められる(scheduleAutoは呼ぶたびに前の予約を消す仕組みのため)。
  function finishBossEncounter(isCorrect){
    saveState();
    renderProgress();
    renderResult(isCorrect, isCorrect ? "ボスを たおした!" : "ざんねん…1マスもどる");
    renderStatusBar();
    const delay = randInt(CONFIG.RESULT_DELAY_MIN, CONFIG.RESULT_DELAY_MAX);
    scheduleAuto(startNextTurn, delay);
  }

  // 回答したときの処理(選択肢クリック、または時間切れ)。通常マス専用。
  function handleAnswer(selected, btnEl){
    if (answered) return;
    answered = true;
    questionTimerActive = false;

    const isCorrect = selected === currentQuestion.answer;

    if (btnEl){
      const allBtns = document.querySelectorAll(".answer-btn");
      allBtns.forEach((b) => {
        b.disabled = true;
        if (Number(b.textContent) === currentQuestion.answer){
          b.classList.add("correct");
        } else if (b === btnEl){
          b.classList.add("wrong");
        }
      });
    }

    if (isCorrect){
      playAdvanceSound(); // 通常マスは正解=必ず進むので、お祝いの音を鳴らす
      state.combo += 1;
      if (state.combo > state.bestCombo) state.bestCombo = state.combo;
      state.score += 10 + state.combo;
      state.currentStage = Math.min(CONFIG.MAP_LENGTH, state.currentStage + 1);
    } else {
      playWrongSound();
      state.combo = 0;
      state.currentStage = Math.max(0, state.currentStage - 1);
    }

    saveState();
    renderProgress();
    renderResult(isCorrect);
    renderStatusBar();

    const delay = randInt(CONFIG.RESULT_DELAY_MIN, CONFIG.RESULT_DELAY_MAX);
    scheduleAuto(startNextTurn, delay);
  }

  // ボーナスのカードを1枚選んだときの処理
  function handleBonusPick(reward, cardEl, cardsArea){
    if (answered) return;
    answered = true;

    cardEl.textContent = "🎉";
    cardEl.classList.add("picked");
    const allCards = cardsArea.querySelectorAll(".bonus-card");
    allCards.forEach((c) => { c.disabled = true; });

    playBonusSound();
    state.combo += 1;
    if (state.combo > state.bestCombo) state.bestCombo = state.combo;
    state.score += reward.score;
    state.currentStage = Math.min(CONFIG.MAP_LENGTH, state.currentStage + reward.steps);

    saveState();
    renderProgress();
    renderResult(true, reward.label + "！");
    renderStatusBar();

    const delay = randInt(CONFIG.RESULT_DELAY_MIN, CONFIG.RESULT_DELAY_MAX);
    scheduleAuto(startNextTurn, delay);
  }

  function togglePause(){
    isPaused = !isPaused;
    const pauseBtn = document.getElementById("pauseBtn");
    pauseBtn.textContent = isPaused ? "▶ さいかい" : "⏸ 一時停止";
    pauseBtn.classList.toggle("active", isPaused);

    const timerInner = document.getElementById("timerInner");

    if (isPaused){
      pauseAutoTimer();
      if (questionTimerActive && timerInner){
        const currentWidthPx = timerInner.getBoundingClientRect().width;
        timerInner.style.transition = "none";
        timerInner.style.width = currentWidthPx + "px";
      }
    } else {
      resumeAutoTimer();
      if (questionTimerActive && timerInner){
        const remaining = autoTimer.remainingMs;
        requestAnimationFrame(() => {
          timerInner.style.transition = `width ${remaining}ms linear`;
          timerInner.style.width = "0px";
        });
      }
    }
    syncPauseOverlay();
  }


  /* ---------------------------------------------------------------
     10. 初期化処理
     --------------------------------------------------------------- */
  async function startNewGame(){
    state = {
      version: CONFIG.SAVE_VERSION,
      cellTypes: generateMap(),
      currentStage: 0,
      score: 0,
      combo: 0,
      bestCombo: 0,
      muted: state.muted,
    };
    bossHitsSoFar = 0;
    await saveState();
    startNextTurn();
  }

  async function init(){
    const saved = await loadState();
    if (saved){
      state = saved;
    } else {
      state.cellTypes = generateMap();
    }
    renderProgress();
    renderStatusBar();
    startNextTurn();

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const ok = confirm("さいしょからやり直しますか？(今のきろくは消えます)");
      if (ok){
        await clearState();
        await startNewGame();
      }
    });

    document.getElementById("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted;
      document.getElementById("muteBtn").textContent = state.muted ? "🔇 音" : "🔊 音";
      saveState();
    });
    document.getElementById("muteBtn").textContent = state.muted ? "🔇 音" : "🔊 音";

    document.getElementById("pauseBtn").addEventListener("click", togglePause);
  }

  init();

</script>
